<!DOCTYPE html>
<html>
<head>
<title>Tomato Leaf Disease Detection</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.bg-image{
background: linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)),
url("{{ url_for('static', filename='images/bg.jpg') }}") no-repeat center center fixed;
background-size: cover;
}

.center-box{
min-height:90vh;
display:flex;
align-items:center;
justify-content:center;
}

.glass-card{
background: rgba(255,255,255,0.9);
backdrop-filter: blur(10px);
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

#preview{
max-width:200px;
margin-top:10px;
display:none;
border-radius:10px;
}

#loading{
display:none;
font-weight:bold;
color:#2c3e50;
margin-top:10px;
}

.footer{
position:fixed;
bottom:0;
width:100%;
text-align:center;
background:#2c3e50;
color:white;
padding:6px;
font-size:14px;
}

</style>
</head>

<body class="bg-image">

<nav class="navbar navbar-dark"
style="background: linear-gradient(90deg,#2c3e50,#27ae60);">

<div class="container justify-content-center">
<span class="navbar-brand fs-2 fw-bold text-white"
style="text-shadow:2px 2px 4px rgba(0,0,0,0.4);">

🌿 Tomato Leaf Disease Detection

</span>
</div>
</nav>

<div class="container center-box">

<div class="card glass-card shadow p-4 text-center" style="width:520px;">

<h3 class="mb-3">Upload Tomato Leaf Image</h3>

<form action="/predict" method="POST" enctype="multipart/form-data" onsubmit="showLoading()">

<input type="file"
name="image"
class="form-control mb-3"
accept="image/*"
onchange="previewImage(event)"
required>

<img id="preview">

<button type="submit" class="btn btn-success px-4 mt-2">
🔍 Predict Disease
</button>

<div id="loading">
Analyzing leaf image with AI model...
</div>

</form>

<hr>

<h5 class="mt-3">Or Try Sample Images</h5>

<a href="/sample/healthy" class="btn btn-outline-success m-2">
Healthy Leaf
</a>

<a href="/sample/early_blight" class="btn btn-outline-danger m-2">
Diseased Leaf
</a>

<hr>

<a href="/about" class="btn btn-secondary btn-sm">
About Project
</a>

</div>

</div>

<script>

function previewImage(event){

const preview=document.getElementById("preview");
preview.src=URL.createObjectURL(event.target.files[0]);
preview.style.display="block";

}

function showLoading(){

document.getElementById("loading").style.display="block";

}

</script>

</body>
</html>
